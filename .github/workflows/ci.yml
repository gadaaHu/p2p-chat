name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  flutter:
    name: Flutter
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test integration_test
      - run: flutter analyze --fatal-warnings
      - run: flutter test --coverage
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-logs
          path: flutter_app/build/test-results/
          retention-days: 7

  server:
    name: FastAPI
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install ruff pip-audit
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: pip-audit -r requirements.txt
      - run: pytest -q

  two-device-webrtc:
    name: Two-device WebRTC
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: server
      - name: Start relay
        working-directory: server
        run: |
          mkdir -p data
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/relay.log 2>&1 &
          for i in {1..30}; do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
      - run: flutter pub get
        working-directory: flutter_app
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: |
          xvfb-run -a flutter test integration_test/two_device_webrtc_test.dart \
            --dart-define=TWO_DEVICE_WEBRTC=true \
            --dart-define=RELAY_BASE_URL=http://127.0.0.1:8000
        working-directory: flutter_app
      - if: failure()
        run: cat /tmp/relay.log

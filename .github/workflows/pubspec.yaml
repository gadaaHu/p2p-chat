name: p2p_chat
description: Serverless end-to-end encrypted peer-to-peer chat.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  crypto: ^3.0.5
  flutter_webrtc: ^1.4.1
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
